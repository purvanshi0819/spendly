{% extends "base.html" %}

{% block title %}Edit expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit_expense.css') }}">
{% endblock %}

{% block content %}

<section class="edit-expense-section">
    <div class="edit-expense-card">
        <header class="edit-expense-header">
            <h1 class="edit-expense-title">Edit expense</h1>
            <p class="edit-expense-subtitle">Update transaction details</p>
        </header>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}" class="edit-expense-form">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" step="0.01" min="0" id="amount" name="amount"
                       class="form-input" placeholder="0.00"
                       value="{{ form.amount if form is defined and form.amount is not none else '' }}" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-input" required>
                    <option value="">Select category</option>
                    {% for c in categories %}
                    <option value="{{ c }}"
                        {% if form is defined and form.category == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" class="form-input"
                       value="{{ form.date if form is defined and form.date is not none else '' }}" required>
            </div>

            <div class="form-group">
                <label for="description">Description (optional)</label>
                <input type="text" id="description" name="description" class="form-input"
                       placeholder="What was this for?"
                       value="{{ form.description if form is defined and form.description is not none else '' }}">
            </div>

            <button type="submit" class="btn-submit">Update expense</button>
        </form>

        <a href="{{ url_for('profile') }}" class="edit-expense-back">← Back to profile</a>
    </div>
</section>

{% endblock %}
